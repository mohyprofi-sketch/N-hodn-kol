<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            justify-content: left;
            align-items: bottom;
            display: flex;
            background-color: yellow;
        }
        .hlavni_okno {
            width: 55%;
            height: 70vh;
            background-color: hsl(236, 93%, 49%);   
            position: absolute; /* or relative/fixed/sticky */
            left: 200px;
            top: 280px;
        }
        .btn1{
            background-color: aqua;
            height: 40px;
            width: 100px;
        }
        .btn2{
            background-color: blueviolet;
        }
        .piratC{
            position: absolute;
            left: 680px;
            top: 400px;
            animation: zvetseni_2 2s ease-in-out infinite alternate;
        }
        .hlavni_tlacitko{
            position: absolute;
            height: 150px;
            width: 300px;
            left: 300px;
            top: 500px;
            justify-content: center;
            align-items: center;
            display: flex;
            background-color: whitesmoke;
        }
        .hlavni_tlacitko:hover{
            background-color: grey;
            
        }
        .text1{
            position: absolute;
            justify-content: center;
            align-items: center;
            display: flex;
            background-color: pink;
            height: 100px;
            width: 800px;
            left: 200px;
            top: 100px;
            border-color: brown;
            border: 5px;
        }
        .text2{
            position: absolute;
            justify-content: center;
            align-items: center;
            display: flex;
            /* background-color: pink; */
            height: 100px;
            width: 800px;
            left: 120px;
            top: 420px;
            /* border-color: brown; */
            border: 5px;
        }
        .tlacitko1{
            position: absolute;
            height: 100px;
            width: 800px;
            left: 1500px;
            top: 600px;
            animation: zvetseni 2s ease-in-out infinite alternate;
        }
        @keyframes zvetseni {
            0%{
                transform: scale(0.5);
            }
            100%{
                transform: scale(5);
            }
            
        }
        @keyframes zvetseni_2 {
            0%{
                transform: scale(0.8);
            }
            100%{
                transform: scale(2);
            }
            
        }
        .kasino{
            position: absolute;
            height: 500px;
            width: 500px;
            left: 750px;
            top: 120px;
        }
        
    </style>
    <img src="loga.png" width=100% height=100%>
    <div class="hlavni_okno">
        <button type="button">Který tým je nejlepší?</button>
        <button type="button" class="btn1"><a href="https://github.com/mohyprofi-sketch/N-hodn-kol/blob/main/gitprojekt.py" class="btn2">Stáhnout</a></button>
        <button type="button">Hry Zdarma?</button>
        <button type="button">Crypto zdarma?</button>
        <button type="button">Passporty zdarma?</button>
        
    </div>
    <div class="hlavni_tlacitko">
        <h1>
            <a href="SouhradaJeNejlepsi.html">Skupina 4</a></h1></div>
    <img src="pirat.png" class="piratC" width="452px" height="536px">
    <div class="text1">
        <h1>Stáhněte si své ChatGPT, úplně ZDARMA!</h1>
    </div>
    <div class="text2">
        <h1>Zvolte jaká skupina je nejlepší</h1>
    </div>
    <div class="tlacitko1">
        <button type="button">Skupina 4!</button>
    </div>
    <img src="betano.png" class="kasino" width="600px" height="600px">
</body>
</html>
